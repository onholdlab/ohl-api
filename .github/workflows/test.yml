# 每個 PR 與 main 的每次 push 都自動跑測試。不經過任何 AI，不花 Claude 用量。
# 來源：onholdlab/rules 的 templates/harness（2026-11-14）。依專案改「跑測試」那幾步。
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
